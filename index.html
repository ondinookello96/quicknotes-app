<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture and organize your notes effortlessly.</p>
  </header>

  <main>
    <!-- Section 1: Add a note -->
    <section>
      <h2>Add a note</h2>
      <form id="note-form">
        <div>
          <label for="note-input">Note text:</label>
          <input type="text" id="note-input" placeholder="What's on your mind?">
        </div>
        
        <div>
          <label for="note-category">Category:</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>

        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <!-- Section 2: Your notes -->
    <section>
      <h2>Your notes</h2>
      <div>
        <input type="text" id="search-input" placeholder="Search notes...">
      </div>
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list">
        <!-- Dynamic note cards will appear here -->
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes App</p>
  </footer>
</body>
</html>
