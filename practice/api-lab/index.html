<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Lab</title>
    <script src="app.js" defer></script>
    <style>
  body {
    font-family: Arial, sans-serif;
    margin: 40px;
  }
  #status {
    font-weight: bold;
    color: #0ba184; /* Gives it a nice green accent color */
    margin: 12px 0;
  }
</style>
    <style>
  #status {
    font-weight: bold;
    color: #0ba184;
    margin: 10px 0;
  }
</style>
  </head>
  <body>
    <h1>QuickNotes API Lab</h1>
    <button id="load-btn">Load notes from server</button>
    <p id="status"></p>
    <ul id="notes-list"></ul>
 
    <h2>Create a note</h2>
    <form id="note-form">
      <label for="title-input">Title</label>
      <input id="title-input" type="text" />
      <button type="submit">Send to server</button>
    </form>
  </body>
</html>
